name: CI

# Runs on every push and every pull request (build + test + lint), per the plan.
on:
  push:
  pull_request:

# If you push again before a run finishes, cancel the older run for the same
# branch. macOS runner minutes are the expensive ones on the free tier (billed
# 10x), so don't pay for a run you've already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Python content pipeline (pipeline/) ----------------------------------
  # Separate job, and deliberately on Linux: it needs no Xcode, and ubuntu runner
  # minutes are billed at 1x against macOS's 10x. Runs in parallel with the app job.
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv installs the pinned interpreter (3.12) itself, so the runner's system
      # Python is irrelevant. --frozen fails if uv.lock is stale rather than
      # silently resolving something else.
      - name: Install uv
        # Pinned to the exact release tag: setup-uv stopped publishing floating
        # major tags after v7, so `@v9` is an unresolvable ref and fails during
        # "Set up job" before any step runs.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Sync dependencies (locked)
        run: uv sync --frozen

      # The Hindi UDPipe model is 25 MB and not in git. Cache it on its pinned
      # checksum, so the real-tagging tests run here instead of skipping, and a
      # cache hit makes `packgen models hi` a checksum check with no download.
      - name: Cache the UDPipe Hindi model
        uses: actions/cache@v4
        with:
          path: pipeline/work/models
          key: udpipe-hi-d7a77399e6eccee9103d8df9b441ec25ba6ba9f4db453eed3f4ddb77acdd7f2a
      - name: Download the UDPipe Hindi model
        run: uv run packgen models hi

      # Same lint the developer runs. `format --check` fails on unformatted code
      # rather than reformatting it.
      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      # pytest's addopts carry the validator coverage floor (--cov-fail-under=95),
      # so this step is the Python half of the coverage gate. The spaCy model is a
      # pinned dependency, so the real-lemmatization tests run here too rather than
      # skipping.
      - name: Tests + validator coverage gate
        run: uv run pytest

      # The pack contract is only real if the fixtures still satisfy it.
      - name: Validate the fixture pack
        run: uv run packgen validate ../fixtures/fr-mini.pack.json

  build-and-test:
    # iOS builds need Xcode, which only exists on macOS runner images.
    runs-on: macos-15
    steps:
      # Pull the repo onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain: use the runner's DEFAULT Xcode. Counterintuitively that's the right
      # one here — its iOS simulator runtime is the one actually installed on this
      # image. The newer co-installed Xcode ships the iOS SDK but NO iOS *simulator*
      # runtime, so selecting it leaves the UI test nowhere to run. The app's iOS 17
      # minimum keeps those installed sims eligible.
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # ---- Domain package: pure Swift, no simulator, runs in seconds ----
      # -Xswiftc -warnings-as-errors is what actually enforces the Swift 6
      # strict-concurrency model from architecture.md §4: a warning fails the build.
      - name: Domain — test with coverage (warnings as errors)
        run: swift test --package-path Packages/Domain --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Domain — coverage gate (>= 90%)
        run: scripts/coverage-gate.sh Packages/Domain 90 DomainPackageTests

      # ---- Data package: imports Domain, still no simulator ----
      - name: Data — test with coverage (warnings as errors)
        run: swift test --package-path Packages/Data --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Data — coverage gate (>= 80%)
        run: scripts/coverage-gate.sh Packages/Data 80 DataPackageTests

      # ---- Cross-cutting gates (CLAUDE.md testing standards) ----
      # Fails if any test reads wall-clock time or uses unseeded randomness.
      - name: Determinism check
        run: scripts/determinism-check.sh
      # The traceability report is advisory, but its *matcher* is not: matching a
      # bare ID anywhere in a file is what let a doc comment count as a test and
      # made the old report lie (C-4). This gate keeps the matcher honest.
      - name: Requirements traceability — matcher self-test
        run: scripts/trace-requirements.sh --self-test
      # Reports which FR-/NFR- IDs still lack a naming test. Report only — never fails.
      - name: Requirements traceability (report only)
        run: scripts/trace-requirements.sh

      # ---- Lint: SwiftLint in --strict mode (any violation fails) ----
      # Use the runner's preinstalled swiftlint if present, else install it.
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

      # ---- App target: the thin SwiftUI shell. Needs Xcode + a simulator ----
      # Requires the FullDeck Xcode project with a *shared* scheme named "FullDeck".
      # Resolve the destination at runtime to the newest iPhone the ACTIVE Xcode can
      # drive: `xcodebuild -showdestinations` (not `simctl list devices`) lists only
      # devices this Xcode can actually run that also meet the app's iOS 17 minimum.
      # GitHub's image co-installs newer iOS runtimes the default Xcode can't drive;
      # showdestinations filters those out. Survives Xcode/device churn. Diagnostics
      # dump on failure so any future runner change is debuggable from one log.
      - name: App — build & test (iOS Simulator)
        run: |
          # Warm CoreSimulator FIRST. On a cold runner `xcodebuild -showdestinations`
          # exits 0 having listed only the three placeholder destinations (My Mac,
          # Any iOS Device, Any iOS Simulator Device) — no concrete simulators at
          # all, and no error explaining their absence. Touching simctl initializes
          # CoreSimulator, after which the same command lists every device.
          xcrun simctl list devices available >/dev/null 2>&1 || true

          # Capture both streams and the exit status, and dump them if selection
          # fails. The original version piped stdout and sent stderr to /dev/null,
          # so the step meant to diagnose a missing simulator discarded the only
          # evidence of why it was missing.
          out=$(mktemp); err=$(mktemp); status=0
          xcodebuild -showdestinations \
            -project FullDeck/FullDeck.xcodeproj -scheme FullDeck \
            >"$out" 2>"$err" || status=$?
          echo "showdestinations: exit=$status stdout=$(wc -l <"$out") lines stderr=$(wc -l <"$err") lines"
          # Read from both streams: which one carries the list has varied by Xcode
          # version, and this step is not worth another red build.
          DEVICE=$(cat "$out" "$err" \
            | grep -oE 'name:iPhone [0-9]+' | grep -oE 'iPhone [0-9]+' \
            | sort -Vr | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No usable iPhone simulator. Diagnostics:"
            echo "--- showdestinations stdout ---"; cat "$out"
            echo "--- showdestinations stderr ---"; cat "$err"
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          # Print the runtimes. known-issues.md's C-1 asserted this job lands on
          # iOS 26.5 — which decides whether the StoreKit adapter suite runs or
          # skips here (E-1) — and nobody had ever checked. Assume it once more
          # and the next person inherits the same guess.
          echo "--- installed iOS runtimes ---"
          xcrun simctl list runtimes | grep -i ios || true

          # Two suites are excluded on purpose, not by accident:
          #
          # StoreKit adapter — E-5 makes the first purchase in a process cost
          # 91-324 s, which cannot sit in a per-push gate. It runs from
          # .github/workflows/storekit-adapter.yml on demand instead.
          #
          # PerformanceUITests — a shared runner is too noisy for NFR-3's 100 ms
          # assertion, so gating it would produce flakes rather than signal
          # (build-plan Phase 13 item 4 says so explicitly). Run it locally with
          # scripts/measure-performance.sh; the numbers live in docs/test-plan.md.
          xcodebuild test \
            -project FullDeck/FullDeck.xcodeproj \
            -scheme FullDeck \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skip-testing:FullDeckTests/StoreKitPurchaseServiceTests \
            -skip-testing:FullDeckUITests/PerformanceUITests \
            CODE_SIGNING_ALLOWED=NO
