name: CI

# Runs on every push and every pull request (build + test + lint), per the plan.
on:
  push:
  pull_request:

# If you push again before a run finishes, cancel the older run for the same
# branch. macOS runner minutes are the expensive ones on the free tier (billed
# 10x), so don't pay for a run you've already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # iOS builds need Xcode, which only exists on macOS runner images.
    runs-on: macos-15
    steps:
      # Pull the repo onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain: use the runner's DEFAULT Xcode. Counterintuitively that's the right
      # one here — its iOS simulator runtime is the one actually installed on this
      # image. The newer co-installed Xcode ships the iOS SDK but NO iOS *simulator*
      # runtime, so selecting it leaves the UI test nowhere to run. We build the app
      # down to iOS 17 (see the app step), which keeps the installed sims eligible.
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      # ---- Domain package: pure Swift, no simulator, runs in seconds ----
      # -Xswiftc -warnings-as-errors is what actually enforces the Swift 6
      # strict-concurrency model from architecture.md §4: a warning fails the build.
      - name: Domain — test with coverage (warnings as errors)
        run: swift test --package-path Packages/Domain --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Domain — coverage gate (>= 90%)
        run: scripts/coverage-gate.sh Packages/Domain 90 DomainPackageTests

      # ---- Data package: imports Domain, still no simulator ----
      - name: Data — test with coverage (warnings as errors)
        run: swift test --package-path Packages/Data --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Data — coverage gate (>= 80%)
        run: scripts/coverage-gate.sh Packages/Data 80 DataPackageTests

      # ---- Cross-cutting gates (CLAUDE.md testing standards) ----
      # Fails if any test reads wall-clock time or uses unseeded randomness.
      - name: Determinism check
        run: scripts/determinism-check.sh
      # Reports which FR-/NFR- IDs still lack a naming test. Report only — never fails.
      - name: Requirements traceability (report only)
        run: scripts/trace-requirements.sh

      # ---- Lint: SwiftLint in --strict mode (any violation fails) ----
      # Use the runner's preinstalled swiftlint if present, else install it.
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint lint --strict

      # ---- App target: the thin SwiftUI shell. Needs Xcode + a simulator ----
      # Requires the FullDeck Xcode project with a *shared* scheme named "FullDeck".
      # Destination is resolved at runtime to the newest iPhone the ACTIVE Xcode can
      # build for. We ask `xcodebuild -showdestinations` (not `simctl list devices`)
      # because GitHub's image co-installs a newer iOS runtime whose devices show up
      # in the global sim set but aren't usable by the default Xcode — showdestinations
      # only lists what this Xcode can actually drive. Survives Xcode/device churn.
      #
      # IPHONEOS_DEPLOYMENT_TARGET override: Xcode 26 defaults new apps to iOS 26.5
      # as the *minimum* — the wrong floor for a shippable app (only the very newest
      # devices could install it). Override to 17.0, the real minimum this app
      # supports (lowest iOS with ContentUnavailableView + the Observation framework),
      # so CI enforces that floor. Builds fine against the newer SDK. TODO(release):
      # lower the project's own setting to 17.0 so local dev and CI agree (local
      # currently builds at 26.5).
      - name: App — build & test (iOS Simulator)
        run: |
          # Query destinations at the SAME 17.0 floor we build with — otherwise
          # xcodebuild judges the installed iOS 18 sims ineligible for the project's
          # 26.5 default and returns nothing. Pick the newest eligible iPhone.
          DEVICE=$(xcodebuild -showdestinations \
            -project FullDeck/FullDeck.xcodeproj -scheme FullDeck \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 2>/dev/null \
            | grep -oE 'name:iPhone [0-9]+' | grep -oE 'iPhone [0-9]+' \
            | sort -Vr | head -1)
          if [ -z "$DEVICE" ]; then
            echo "No usable iPhone simulator. Diagnostics:"
            xcrun simctl list runtimes
            xcrun simctl list devices available
            xcodebuild -showdestinations -project FullDeck/FullDeck.xcodeproj \
              -scheme FullDeck IPHONEOS_DEPLOYMENT_TARGET=17.0
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project FullDeck/FullDeck.xcodeproj \
            -scheme FullDeck \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_ALLOWED=NO
